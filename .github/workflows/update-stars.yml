name: Update Stars

on:
  schedule:
    # Every Monday at 09:07 UTC (avoid :00/:30 to reduce API contention)
    - cron: '7 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up GitHub CLI
        run: |
          gh auth status
        env:
          GH_TOKEN: ${{ secrets.STARS_PAT }}

      - name: Fetch stars and generate README
        run: python scripts/update_stars.py
        env:
          GH_TOKEN: ${{ secrets.STARS_PAT }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md .repo_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly stars index update $(date -u +%Y-%m-%d)"
            git push
          fi
